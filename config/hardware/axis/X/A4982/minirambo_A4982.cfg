[output_pin stepper_xy_current]
pin = XY_REF_PWM
pwm = True
scale = 2000.0
cycle_time = .002
hardware_pwm = True

# [static_digital_output x_microstepping]
# pins = 
# 	X_MICROSTEP_1, X_MICROSTEP_2


# Fixme try stuff
[ad5206 stepper_digipot]
enable_pin: PD7
# Scale the config so that the channel value can be specified in amps.
# (For Rambo v1.0d boards, use 1.56 instead.)
scale: 2.08
# Channel 1 is E0, 2 is E1, 3 is unused, 4 is Z, 5 is X, 6 is Y
channel_1: 1.34
channel_2: 1.0
channel_4: 1.1
channel_5: 1.1
channel_6: 1.1

# Enable 16 micro-steps on steppers X, Y, Z, E0, E1
[static_digital_output stepper_config]
pins:
    X_MICROSTEP_1, X_MICROSTEP_2,
    Y_MICROSTEP_1, Z_MICROSTEP_2,
    Z_MICROSTEP_1, Z_MICROSTEP_2,
    E_MICROSTEP_1, E_MICROSTEP_2,
 